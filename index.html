<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAO Enterprise Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>BAO Enterprise</h1>
        <p>Printing &amp; Photocopy Calculator</p>
      </div>
    </header>

    <section class="calculator-grid">
      <article class="card photocopy-card">
        <div class="card-heading">
          <span class="eyebrow">SERVICE 01</span>
          <h2>Photocopy</h2>
        </div>

        <div class="field-group a4-copy-group">
          <label>A4 Quantity</label>
          <div class="multiply-inputs">
            <div class="mini-field">
              <span class="mini-label">Muka Surat</span>
              <input id="a4pages" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="A4 muka surat" oninput="calc()">
            </div>

            <span class="multiply-sign" aria-hidden="true">×</span>

            <div class="mini-field">
              <span class="mini-label">Set</span>
              <input id="a4sets" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="A4 bilangan set" oninput="calc()">
            </div>
          </div>
          <div class="quantity-result">
            Total muka surat: <strong id="a4copyTotal">0 ms</strong>
          </div>
        </div>

        <div class="field-group">
          <label for="a3copy">A3 Quantity</label>
          <input id="a3copy" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="calc()">
        </div>

        <div class="field-group ic-group">
          <div class="label-row">
            <label for="iccopy">IC</label>
            <span class="rate-badge">RM 0.20 / keping</span>
          </div>
          <input id="iccopy" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="IC quantity" oninput="calc()">
        </div>
      </article>

      <article class="card printing-card">
        <div class="card-heading">
          <span class="eyebrow">SERVICE 02</span>
          <h2>Printing</h2>
        </div>

        <div class="printing-fields">
          <div class="field-group">
            <label for="a4bw">A4 Black &amp; White</label>
            <input id="a4bw" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="calc()">
          </div>

          <div class="field-group">
            <label for="a410">A4 Colour 10%</label>
            <input id="a410" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="calc()">
          </div>

          <div class="field-group">
            <label for="a450">A4 Colour 50%</label>
            <input id="a450" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="calc()">
          </div>

          <div class="field-group">
            <label for="a4100">A4 Colour 100%</label>
            <input id="a4100" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="calc()">
          </div>

          <div class="field-group">
            <label for="a3bw">A3 Black &amp; White</label>
            <input id="a3bw" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="calc()">
          </div>
        </div>
      </article>

      <aside class="summary-panel" aria-live="polite">
        <div class="summary-content">
          <span class="summary-label">TOTAL PRICE</span>
          <div class="price">
            <span class="currency">RM</span>
            <span id="total">0.00</span>
          </div>
          <p class="summary-note">Amount updates automatically as you enter quantities.</p>
        </div>
        <button id="resetBtn" type="button" onclick="resetCalc()">Reset</button>
      </aside>
    </section>
  </main>

  <script>
    function qty(id) {
      const el = document.getElementById(id);
      if (!el) return 0;
      const value = Number(el.value);
      return Number.isFinite(value) && value > 0 ? value : 0;
    }

    function calc() {
      let total = 0;

      // A4 Photocopy: muka surat × set
      const a4pages = qty("a4pages");
      const a4sets = qty("a4sets");
      const a4copy = a4pages * a4sets;

      const a3copy = qty("a3copy");
      const iccopy = qty("iccopy");
      const a4bw = qty("a4bw");
      const a410 = qty("a410");
      const a450 = qty("a450");
      const a4100 = qty("a4100");
      const a3bw = qty("a3bw");

      const totalPagesEl = document.getElementById("a4copyTotal");
      if (totalPagesEl) totalPagesEl.textContent = a4copy + " ms";

      // Photocopy A4
      if (a4copy <= 5) total += a4copy * 0.20;
      else if (a4copy <= 10) total += (5 * 0.20) + ((a4copy - 5) * 0.10);
      else total += (5 * 0.20) + (5 * 0.10) + ((a4copy - 10) * 0.05);

      // Photocopy A3
      if (a3copy <= 10) total += a3copy * 0.50;
      else total += (10 * 0.50) + ((a3copy - 10) * 0.30);

      // IC: RM0.20 / keping
      total += iccopy * 0.20;

      // Printing A4 Black & White
      if (a4bw <= 10) total += a4bw * 0.50;
      else total += (10 * 0.50) + ((a4bw - 10) * 0.30);

      // Printing A4 Colour 10%
      if (a410 <= 10) total += a410 * 0.80;
      else total += (10 * 0.80) + ((a410 - 10) * 0.60);

      // Printing A4 Colour 50%
      if (a450 <= 10) total += a450 * 1.80;
      else total += (10 * 1.80) + ((a450 - 10) * 1.30);

      // Printing A4 Colour 100%
      if (a4100 <= 10) total += a4100 * 3.00;
      else total += (10 * 3.00) + ((a4100 - 10) * 2.00);

      // Printing A3 Black & White
      if (a3bw <= 10) total += a3bw * 1.00;
      else total += (10 * 1.00) + ((a3bw - 10) * 0.50);

      const totalEl = document.getElementById("total");
      if (totalEl) totalEl.textContent = total.toFixed(2);
    }

    function resetCalc() {
      document.querySelectorAll('input[type="number"]').forEach((input) => {
        input.value = 0;
      });
      calc();
      const first = document.getElementById("a4pages");
      if (first) first.focus();
    }

    // Extra fallback listeners for browsers/devices.
    document.querySelectorAll('input[type="number"]').forEach((input) => {
      input.addEventListener("input", calc);
      input.addEventListener("change", calc);
    });

    calc();
  </script>
</body>
</html>
