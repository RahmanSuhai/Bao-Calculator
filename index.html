<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAO Enterprise Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>BAO Enterprise</h1>
        <p>Printing &amp; Photocopy Calculator</p>
      </div>
    </header>

    <section class="calculator-grid">
      <article class="card photocopy-card">
        <div class="card-heading">
          <span class="eyebrow">SERVICE 01</span>
          <h2>Photocopy</h2>
        </div>

        <div class="field-group a4-copy-group">
          <label>A4 Quantity</label>
          <div class="multiply-inputs">
            <div class="mini-field">
              <span class="mini-label">Muka Surat</span>
              <input id="a4pages" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="A4 muka surat">
            </div>

            <span class="multiply-sign" aria-hidden="true">×</span>

            <div class="mini-field">
              <span class="mini-label">Set</span>
              <input id="a4sets" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="A4 bilangan set">
            </div>
          </div>
          <div class="quantity-result">
            Total muka surat: <strong id="a4copyTotal">0 ms</strong>
          </div>
        </div>

        <div class="field-group">
          <label for="a3copy">A3 Quantity</label>
          <input id="a3copy" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>

        <div class="field-group ic-group">
          <div class="label-row">
            <label for="iccopy">IC</label>
            <span class="rate-badge">RM 0.20 / keping</span>
          </div>
          <input id="iccopy" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="IC quantity">
        </div>
      </article>

      <article class="card printing-card">
        <div class="card-heading">
          <span class="eyebrow">SERVICE 02</span>
          <h2>Printing</h2>
        </div>

        <div class="printing-fields">
          <div class="field-group">
            <label for="a4bw">A4 Black &amp; White</label>
            <input id="a4bw" type="number" min="0" step="1" value="0" inputmode="numeric">
          </div>

          <div class="field-group">
            <label for="a410">A4 Colour 10%</label>
            <input id="a410" type="number" min="0" step="1" value="0" inputmode="numeric">
          </div>

          <div class="field-group">
            <label for="a450">A4 Colour 50%</label>
            <input id="a450" type="number" min="0" step="1" value="0" inputmode="numeric">
          </div>

          <div class="field-group">
            <label for="a4100">A4 Colour 100%</label>
            <input id="a4100" type="number" min="0" step="1" value="0" inputmode="numeric">
          </div>

          <div class="field-group">
            <label for="a3bw">A3 Black &amp; White</label>
            <input id="a3bw" type="number" min="0" step="1" value="0" inputmode="numeric">
          </div>
        </div>
      </article>

      <aside class="summary-panel" aria-live="polite">
        <div class="summary-content">
          <span class="summary-label">TOTAL PRICE</span>
          <div class="price">
            <span class="currency">RM</span>
            <span id="total">0.00</span>
          </div>
          <p class="summary-note">Amount updates automatically as you enter quantities.</p>
        </div>
        <button id="resetBtn" type="button" onclick="resetCalc()">Reset</button>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
